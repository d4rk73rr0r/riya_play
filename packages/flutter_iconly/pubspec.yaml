name: flutter_iconly
description: 300+ Free icons for your next project in 5 styles (Light, Bold, Broken) for flutter. Icons designed by piqo.
# Vendored locally: upstream 1.0.2 subclasses the now-`final` IconData class,
# which fails to compile on current Dart SDKs. Patched to construct IconData
# directly instead of subclassing it — same icons, same font assets.
version: 1.0.2
repository: https://github.com/m-noer/flutter_iconly.git

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: IconlyBold
      fonts:
        - asset: fonts/iconly_bold.ttf
    - family: IconlyLight
      fonts:
        - asset: fonts/IconlyLight.ttf
    - family: IconlyBroken
      fonts:
        - asset: fonts/IconlyBroken.ttf
