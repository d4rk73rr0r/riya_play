name: riya_play
description: Riya Play Downloader Flutter App
publish_to: 'none'
# Versiyaning yagona manbasi. `flutter build` shu yerdan `android/local.properties`
# ga `flutter.versionName` / `flutter.versionCode` yozadi, `build.gradle.kts` esa
# o'sha qiymatlarni o'qiydi — qo'lda hech qayerga yozib qo'yish shart emas.
#
# `--split-per-abi` bilan yig'ilganda APK ichidagi versionCode ABI siljishi bilan
# hisoblanadi: armeabi-v7a = 1000 + N, arm64-v8a = 2000 + N, x86_64 = 4000 + N.
# Ya'ni `+10` arm64 uchun 2010 beradi (oldingi reliz 2009 dan katta).
version: 1.0.9+10

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # firebase_core: ^2.32.0 – o‘chirilgan
  url_launcher: ^6.3.1
  android_intent_plus: ^5.3.0
  connectivity_plus: ^6.1.4
  provider: ^6.1.1
  package_info_plus: ^8.0.2
  # GitHub Releases orqali ilova ichida yangilanish (Play Store'dan tashqari
  # tarqatilganda kerak).
  ota_update: ^7.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  wakelock_plus: ^1.2.11
  intl: ^0.20.2
  mobile_scanner: ^6.0.10
  permission_handler: ^12.0.0+1
  # HLS AES-128 segmentlarini yuklab olishda deshifrlash uchun
  pointycastle: ^4.0.0
  # .ts -> .mp4 remuxing uchun. "min" varianti ataylab tanlangan: u LGPL
  # (ilova yopiq kodli qolaveradi) va APK hajmiga eng kam qo'shadi. Bizga
  # kodeklar kerak emas — remuxing faqat konteynerni almashtiradi (-c copy).
  ffmpeg_kit_flutter_new_min: ^3.6.2
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.2
  logger: ^2.5.0
  shimmer: ^3.0.0
  skeletonizer: ^1.4.3
  app_settings: ^6.1.1
  better_player:
    git: https://github.com/Lo4D/better-player-ultra.git
  flutter_spinkit: ^5.2.1
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0
  flutter_iconly:
    path: packages/flutter_iconly
  google_fonts: ^6.3.3
  carousel_slider: ^5.0.0
  sms_autofill: ^2.3.0
  device_info_plus: ^11.3.3
  screen_brightness: ^2.1.2
  screen_brightness_android: ^2.1.1
  screen_brightness_ios: ^2.1.1
  flutter_local_notifications: ^22.3.0
  android_alarm_manager_plus: ^5.1.1
flutter:
  uses-material-design: true
  assets:
    - assets/images/background.png
    - assets/images/logo.png
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.3